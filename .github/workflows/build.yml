name: Build LOAN CONTROL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: loan-control-debug-signing-v1
      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Roots Cobrancas,C=BR"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Alias name:"
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rootscobrancas --project-name loan_control .
      - name: Configure Android signing like Cobrapp12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          target = '        release {\n'
          replacement = '        release {\n            signingConfig = signingConfigs.getByName("debug")\n'
          if 'signingConfig = signingConfigs.getByName("debug")' not in s:
              if target not in s:
                  raise SystemExit('release block not found in build.gradle.kts')
              s = s.replace(target, replacement, 1)
          p.write_text(s)
          PY
          grep -n "signingConfig" android/app/build.gradle.kts
      - name: Set app label
        run: sed -i 's/android:label="loan_control"/android:label="Roots Cobranças"/' android/app/src/main/AndroidManifest.xml
      - name: Integrate reconstructed flows
        run: |
          if ! grep -q "import 'customer_flow.dart';" lib/main.dart; then
            sed -i "/import 'package:flutter\/material.dart';/a import 'customer_flow.dart';" lib/main.dart
          fi
          sed -i '0,/const CustomersPage()/s//const OriginalCustomerFlow()/' lib/main.dart

          if ! grep -q "import 'payment_flow.dart';" lib/customer_flow.dart; then
            sed -i "/import 'main.dart';/a import 'payment_flow.dart';" lib/customer_flow.dart
          fi
          if ! grep -q "import 'loan_workspace.dart';" lib/customer_flow.dart; then
            sed -i "/import 'main.dart';/a import 'loan_workspace.dart';" lib/customer_flow.dart
          fi
          if ! grep -q "import 'customer_detail_ref.dart';" lib/customer_flow.dart; then
            sed -i "/import 'main.dart';/a import 'customer_detail_ref.dart';" lib/customer_flow.dart
          fi

          sed -i 's/builder: (_) => OriginalPaymentPage(loan: loan)/builder: (_) => ConnectedPaymentPage(loan: loan)/' lib/customer_flow.dart
          sed -i 's/builder: (_) => OriginalCustomerDetail(/builder: (_) => ReferenceCustomerDetailPage(/' lib/customer_flow.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/customer_flow.dart')
          s = p.read_text()
          s = s.replace(
              "LoanDetail(loanId: loan['id'].toString()),",
              "LoanWorkspacePage(loan: loan, customerName: customerName, customerId: widget.customer['id']?.toString()),",
          )
          p.write_text(s)

          p = Path('lib/loan_workspace.dart')
          s = p.read_text()
          if "import 'loan_button_actions.dart';" not in s:
              s = s.replace("import 'payment_flow.dart';", "import 'payment_flow.dart';\nimport 'loan_button_actions.dart';", 1)
          s = s.replace(
              "onSelected: _notImplemented,",
              "onSelected: (value) => LoanButtonActions.handleMenu(context, value, loan: {...widget.loan, ...detail}, customerName: customerName, customerId: widget.customerId, onReload: _load),",
              1,
          )
          s = s.replace(
              "onPressed: () => _notImplemented('Editar crédito'),",
              "onPressed: () => LoanButtonActions.editCredit(context, loan: {...widget.loan, ...detail}, onReload: _load),",
              1,
          )
          s = s.replace(
              "onPressed: () => _notImplemented('Remover'),",
              "onPressed: () => LoanButtonActions.removeLoan(context, loan: {...widget.loan, ...detail}),",
              1,
          )
          s = s.replace(
              "onPressed: () => _notImplemented('Imprimir'),",
              "onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => LoanPreviewPage(loan: {...widget.loan, ...detail}, mode: 'plan'))),",
              1,
          )
          p.write_text(s)
          PY
      - name: Apply verified visual proportions from original reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('height: 180,', 'height: 116,', 1)
          s = s.replace('padding: const EdgeInsets.fromLTRB(24, 48, 16, 42),', 'padding: const EdgeInsets.fromLTRB(18, 36, 14, 20),', 1)
          s = s.replace("fontSize: 30, fontWeight: FontWeight.w400", "fontSize: 24, fontWeight: FontWeight.w400", 1)
          s = s.replace('Container(width: 44, height: 44,', 'Container(width: 36, height: 36,', 1)
          s = s.replace('borderRadius: BorderRadius.circular(13)', 'borderRadius: BorderRadius.circular(11)', 2)
          start = s.find('class QuickCard extends StatelessWidget')
          end = s.find('class CollectionCard extends StatelessWidget', start)
          if start < 0 or end < 0:
              raise SystemExit('QuickCard block not found')
          block = s[start:end]
          block = block.replace('borderRadius: BorderRadius.circular(18)', 'borderRadius: BorderRadius.circular(13)')
          block = block.replace('height: 126,', 'height: 82,')
          block = block.replace('padding: const EdgeInsets.all(12),', 'padding: const EdgeInsets.all(8),')
          block = block.replace('Container(width: 40, height: 40,', 'Container(width: 29, height: 29,')
          block = block.replace('borderRadius: BorderRadius.circular(12)', 'borderRadius: BorderRadius.circular(8)')
          s = s[:start] + block + s[end:]
          s = s.replace('FloatingActionButton.large(backgroundColor: mint,', 'FloatingActionButton(backgroundColor: mint,', 1)
          p.write_text(s)

          p = Path('lib/customer_flow.dart')
          s = p.read_text()
          s = s.replace('width: 265,\n                    height: 58,', 'width: 150,\n                    height: 42,', 1)
          s = s.replace('borderRadius: BorderRadius.circular(29)', 'borderRadius: BorderRadius.circular(21)', 1)
          s = s.replace('radius: 24,\n          backgroundColor: mintDark,', 'radius: 20,\n          backgroundColor: mintDark,', 1)
          s = s.replace('borderRadius: BorderRadius.circular(21)', 'borderRadius: BorderRadius.circular(16)', 1)
          s = s.replace('contentPadding: const EdgeInsets.symmetric(horizontal: 15, vertical: 7)', 'contentPadding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4)', 1)
          p.write_text(s)

          p = Path('lib/payment_flow.dart')
          s = p.read_text()
          s = s.replace("const Text('Adicionar Pagamento', style: TextStyle(fontSize: 22, fontWeight: FontWeight.w900))", "const Text('Adicionar Empréstimo', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w500))", 1)
          old = """                    SizedBox(\n                      width: double.infinity,\n                      height: 58,\n                      child: FilledButton.icon("""
          new = """                    Center(\n                      child: SizedBox(\n                        width: 250,\n                        height: 46,\n                        child: FilledButton.icon("""
          if old in s:
              s = s.replace(old, new, 1)
              close_old = """                        label: Text(saving ? 'SALVANDO...' : 'GUARDE O PAGAMENTO', style: const TextStyle(fontWeight: FontWeight.w900)),\n                      ),\n                    ),"""
              close_new = """                          label: Text(saving ? 'SALVANDO...' : 'GUARDE O PAGAMENTO', style: const TextStyle(fontWeight: FontWeight.w900)),\n                        ),\n                      ),\n                    ),"""
              s = s.replace(close_old, close_new, 1)
          p.write_text(s)
          PY
      - name: Fix source syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = "          })),\n        ]),\n      ),\n      floatingActionButton: FloatingActionButton(backgroundColor: mint, onPressed: () => openPage(context, 'Criar Cliente', const CreateCustomerPage()), child: const Icon(Icons.add)),"
          new = "          }))),\n        ]),\n      ),\n      floatingActionButton: FloatingActionButton(backgroundColor: mint, onPressed: () => openPage(context, 'Criar Cliente', const CreateCustomerPage()), child: const Icon(Icons.add)),"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/customer_flow.dart')
          s = p.read_text()
          s = s.replace("R$ 0,00", "R\\$ 0,00")
          p.write_text(s)

          p = Path('lib/customer_detail_ref.dart')
          s = p.read_text()
          s = s.replace('Icons.person_edit_alt_1_outlined', 'Icons.edit_outlined')
          s = s.replace('margin: const EdgeInsets.only(top: -16),', 'transform: Matrix4.translationValues(0, -16, 0),')
          p.write_text(s)
          PY
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos
      - name: Build release APK
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          echo "Android versionCode: $BUILD_NUMBER"
          flutter build apk --release --build-number="$BUILD_NUMBER"
      - name: Force stable APK signing key
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"
      - name: Verify APK signing and package
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2); exit}')
          echo "Expected signer: $EXPECTED"
          echo "Actual signer:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name=" | head -1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOAN-CONTROL-APK-TESTE
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
