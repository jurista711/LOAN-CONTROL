name: Build LOAN CONTROL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rootscobrancas --project-name loan_control .
      - name: Set app label
        run: sed -i 's/android:label="loan_control"/android:label="Roots Cobranças"/' android/app/src/main/AndroidManifest.xml
      - name: Integrate reconstructed customer flow
        run: |
          sed -i "/import 'package:flutter\/material.dart';/a import 'customer_flow.dart';" lib/main.dart
          sed -i '0,/const CustomersPage()/s//const OriginalCustomerFlow()/' lib/main.dart
      - name: Fix legacy customer-list syntax
        run: perl -0pi -e 's/\}\)\),\n        \]\),/\}\)\),\n        \]\),/' lib/main.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOAN-CONTROL-APK-TESTE
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
